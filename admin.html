<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Lia Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(to bottom, #050A14, #0B1021);
            min-height: 100vh;
            color: #fff;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Login Screen */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: linear-gradient(to bottom, #050A14, #0B1021);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }

        .login-box h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: rgba(0, 240, 255, 0.95);
        }

        .login-box p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            color: rgba(0, 240, 255, 0.95);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .error-message {
            color: #ff0055;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Admin Panel */
        #adminPanel {
            display: none;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 32px;
            color: rgba(0, 240, 255, 0.95);
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
        }

        .upload-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-card:hover {
            border-color: rgba(0, 240, 255, 0.6);
            background: rgba(0, 240, 255, 0.05);
        }

        .upload-card.dragover {
            border-color: rgba(0, 240, 255, 0.8);
            background: rgba(0, 240, 255, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .upload-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: rgba(0, 240, 255, 0.95);
        }

        .upload-card p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .image-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .image-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }

        .image-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .image-info {
            padding: 15px;
        }

        .image-name {
            font-size: 14px;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .image-actions {
            display: flex;
            gap: 10px;
        }

        .btn-delete {
            flex: 1;
            padding: 8px;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 6px;
            color: rgba(255, 0, 85, 0.9);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: rgba(255, 0, 85, 0.2);
        }

        .hidden {
            display: none !important;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 2000;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px 8px 0 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
        }

        .tab.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
            color: rgba(0, 240, 255, 0.95);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Page Editor */
        .editor-container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 200px);
        }

        .editor-preview {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .editor-preview iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .editor-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .toolbar-btn {
            padding: 8px 16px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: rgba(0, 240, 255, 0.95);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toolbar-btn:hover {
            background: rgba(0, 240, 255, 0.2);
        }

        .toolbar-btn.success {
            background: rgba(0, 255, 100, 0.1);
            border-color: rgba(0, 255, 100, 0.3);
            color: rgba(0, 255, 100, 0.95);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>Admin Panel</h2>
            <p>Enter password to access image management</p>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('images')">📷 Image Management</div>
            <div class="tab" onclick="switchTab('editor')">✏️ Page Editor</div>
        </div>

        <!-- Tab Content: Image Management -->
        <div id="tab-images" class="tab-content active">
            <div class="admin-grid" id="imageGrid">
                <!-- Upload Card -->
                <div class="upload-card" id="uploadCard" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📤</div>
                    <h3>Upload Image</h3>
                    <p>Click or drag & drop to upload</p>
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display: none;" onchange="handleFileSelect(event)">
                </div>

                <!-- Image cards will be dynamically added here -->
            </div>
        </div>

        <!-- Tab Content: Page Editor -->
        <div id="tab-editor" class="tab-content">
            <div class="editor-container">
                <div class="editor-preview">
                    <div class="editor-toolbar">
                        <button class="toolbar-btn" onclick="saveChanges()">💾 Save Changes</button>
                        <button class="toolbar-btn" onclick="reloadPreview()">🔄 Reload</button>
                    </div>
                    <iframe id="pagePreview" src="./index.html"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://127.0.0.1:3001'; // Will be updated for production
        const ADMIN_PASSWORD = 'admin123'; // Temporary - will be moved to backend

        // Note: Backend CORS is configured for http://127.0.0.1:8080
        // If using different port, update backend .env ALLOWED_ORIGIN

        // Login
        function login() {
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').style.display = 'block';
                sessionStorage.setItem('adminAuth', 'true');
                loadImages();
            } else {
                errorMessage.style.display = 'block';
            }
        }

        // Logout
        function logout() {
            sessionStorage.removeItem('adminAuth');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminPanel').style.display = 'none';
        }

        // Check if already logged in
        if (sessionStorage.getItem('adminAuth') === 'true') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').style.display = 'block';
            loadImages();
        }

        // Drag & Drop
        const uploadCard = document.getElementById('uploadCard');

        uploadCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadCard.classList.add('dragover');
        });

        uploadCard.addEventListener('dragleave', () => {
            uploadCard.classList.remove('dragover');
        });

        uploadCard.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadCard.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });

        // Handle file select
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        // Upload file
        async function uploadFile(file) {
            // Validate file type
            const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                alert('Invalid file type. Please upload JPG, PNG, or WebP images.');
                return;
            }

            // Validate file size (5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('File size exceeds 5MB. Please upload a smaller image.');
                return;
            }

            // Show loading
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.textContent = 'Uploading...';
            document.body.appendChild(loading);

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('Upload success:', result);
                    loadImages(); // Reload image list
                } else {
                    alert('Upload failed. Please try again.');
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert('Upload failed. Please check if the backend server is running.');
            } finally {
                document.body.removeChild(loading);
            }
        }

        // Load images
        async function loadImages() {
            try {
                const response = await fetch(`${API_BASE}/api/images`);
                if (response.ok) {
                    const images = await response.json();
                    renderImages(images);
                }
            } catch (error) {
                console.error('Load images error:', error);
            }
        }

        // Render images
        function renderImages(images) {
            const grid = document.getElementById('imageGrid');

            // Remove existing image cards (keep upload card)
            const existingCards = grid.querySelectorAll('.image-card');
            existingCards.forEach(card => card.remove());

            // Add image cards
            images.forEach(image => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${API_BASE}/uploads/${image.filename}" alt="${image.filename}" class="image-preview">
                    <div class="image-info">
                        <div class="image-name">${image.filename}</div>
                        <div class="image-actions">
                            <button class="btn-delete" onclick="deleteImage('${image.filename}')">Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Delete image
        async function deleteImage(filename) {
            if (!confirm(`Delete ${filename}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/images/${filename}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadImages(); // Reload image list
                } else {
                    alert('Delete failed. Please try again.');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Delete failed. Please try again.');
            }
        }

        // Enter key to login
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Page Editor Functions
        let iframeDoc = null;
        let iframe = null;

        // Tab switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Load images when switching to images tab
            if (tabName === 'images') {
                loadImages();
            }

            // Initialize editor when switching to editor tab
            if (tabName === 'editor') {
                setTimeout(() => {
                    initializeEditor();
                }, 100);
            }
        }

        // Initialize editor
        function initializeEditor() {
            iframe = document.getElementById('pagePreview');
            if (!iframe) {
                console.error('Iframe not found');
                return;
            }

            // Remove old listener if exists
            iframe.onload = null;

            // Add load listener
            iframe.onload = () => {
                try {
                    iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    enableEditing();
                    console.log('Editor initialized successfully');
                } catch (error) {
                    console.error('Failed to access iframe:', error);
                    alert('Failed to load editor. Make sure index.html is accessible.');
                }
            };

            // Reload iframe to trigger load event
            iframe.src = './index.html?' + Date.now();
        }
        function enableEditing() {
            if (!iframeDoc) return;

            // Make text elements editable on double-click
            const textElements = iframeDoc.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, div, a');
            textElements.forEach(el => {
                el.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    if (el.contentEditable === 'true') return;

                    el.contentEditable = 'true';
                    el.focus();
                    el.style.outline = '2px solid rgba(0, 240, 255, 0.5)';

                    el.addEventListener('blur', () => {
                        el.contentEditable = 'false';
                        el.style.outline = 'none';
                    }, { once: true });
                });
            });

            // Make images clickable for upload
            const images = iframeDoc.querySelectorAll('img');
            images.forEach(img => {
                img.style.cursor = 'pointer';
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    uploadImageForElement(img);
                });
            });

            console.log('Editing enabled: Double-click text to edit, click images to replace');
        }

        // Upload image for specific element
        function uploadImageForElement(imgElement) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/jpeg,image/png,image/webp';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Validate file
                const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!validTypes.includes(file.type)) {
                    alert('Invalid file type. Please upload JPG, PNG, or WebP images.');
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert('File size exceeds 5MB. Please upload a smaller image.');
                    return;
                }

                // Upload to server
                const formData = new FormData();
                formData.append('image', file);

                try {
                    const response = await fetch(`${API_BASE}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        // Update image src
                        imgElement.src = `${API_BASE}/uploads/${result.filename}`;
                        alert('Image uploaded successfully!');
                    } else {
                        alert('Upload failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Upload failed. Please check if the backend server is running.');
                }
            };

            input.click();
        }

        // Reload preview
        function reloadPreview() {
            const iframe = document.getElementById('pagePreview');
            iframe.src = iframe.src;
        }

        // Save changes
        async function saveChanges() {
            if (!iframeDoc) {
                alert('No content to save');
                return;
            }

            const htmlContent = iframeDoc.documentElement.outerHTML;

            try {
                const response = await fetch(`${API_BASE}/api/content`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: htmlContent })
                });

                if (response.ok) {
                    alert('Changes saved successfully!');
                } else {
                    alert('Save failed. Please try again.');
                }
            } catch (error) {
                console.error('Save error:', error);
                alert('Save failed. Backend API not implemented yet.');
            }
        }
    </script>
</body>
</html>
